name: Z-Download Pro APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear proyecto Z-Download Pro
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'ZEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.zdownload.pro"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.zdownload.pro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug") // instalable directo
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("io.coil-kt:coil-compose:2.7.0")
              // Motor yt-dlp (para actualizar yt-dlp, sube este número de versión)
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
          }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Z-Download Pro"
                  android:icon="@drawable/ic_launcher"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Z">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Aparece en el menú "Compartir" de otras apps -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/java/com/zdownload/pro/DownloadService.kt')"
          cat > 'app/src/main/java/com/zdownload/pro/DownloadService.kt' <<'ZEOF'
          package com.zdownload.pro

          import android.app.*
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.os.IBinder
          import android.provider.MediaStore
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.io.File
          import java.util.UUID
          import java.util.concurrent.ConcurrentHashMap

          object Engine {
              @Volatile private var ok = false

              @Synchronized
              fun ensure(c: Context) {
                  if (!ok) {
                      YoutubeDL.getInstance().init(c.applicationContext)
                      runCatching { FFmpeg.getInstance().init(c.applicationContext) }
                      ok = true
                  }
                  // Actualiza yt-dlp (las plataformas cambian seguido) como máximo cada 12 horas
                  val prefs = c.getSharedPreferences("z", 0)
                  val now = System.currentTimeMillis()
                  if (now - prefs.getLong("upd", 0L) > 12 * 3600_000L) {
                      if (updateYtDlp(c)) prefs.edit().putLong("upd", now).apply()
                  }
              }

              private fun findChannel(t: Class<*>): Any? {
                  for (n in listOf("NIGHTLY", "STABLE")) {
                      runCatching { t.getField(n).get(null)?.let { return it } }
                      runCatching { t.getField("_$n").get(null)?.let { return it } }
                      runCatching {
                          val comp = t.getField("Companion").get(null)!!
                          comp.javaClass.methods.firstOrNull {
                              it.parameterCount == 0 && it.name.lowercase().contains(n.lowercase())
                          }?.invoke(comp)?.let { return it }
                      }
                      runCatching {
                          t.declaredClasses.firstOrNull { it.simpleName.trimStart('_').equals(n, true) }
                              ?.getField("INSTANCE")?.get(null)?.let { return it }
                      }
                      runCatching {
                          t.enumConstants?.firstOrNull { it.toString().contains(n, true) }?.let { return it }
                      }
                  }
                  return null
              }

              private fun updateYtDlp(c: Context): Boolean = try {
                  val y = YoutubeDL.getInstance()
                  val m = y.javaClass.methods.first { it.name == "updateYoutubeDL" && it.parameterTypes.size == 2 }
                  val ch = findChannel(m.parameterTypes[1])
                  if (ch == null) false else { m.invoke(y, c.applicationContext, ch); true }
              } catch (e: Throwable) { false }

              /** Intentos: normal y, para YouTube, clientes alternativos que no necesitan JS */
              fun attempts(url: String): List<String?> =
                  if (url.contains("youtu")) listOf(null, "youtube:player_client=android_vr", "youtube:player_client=tv")
                  else listOf(null)

              private fun JSONObject.str(k: String): String? = if (isNull(k)) null else optString(k).ifBlank { null }

              fun fetchInfo(c: Context, url: String): VInfo {
                  ensure(c)
                  var last: Exception? = null
                  for (a in attempts(url)) {
                      try {
                          val req = YoutubeDLRequest(url).apply {
                              addOption("--dump-single-json")
                              addOption("--no-playlist")
                              addOption("--skip-download")
                              addOption("--no-warnings")
                              addOption("--socket-timeout", "20")
                              if (a != null) addOption("--extractor-args", a)
                          }
                          val out = YoutubeDL.getInstance().execute(req, null, null).out
                          val j = JSONObject(out.substring(out.indexOf('{')))
                          val hs = sortedSetOf<Int>()
                          j.optJSONArray("formats")?.let { fm ->
                              for (i in 0 until fm.length()) {
                                  val f = fm.getJSONObject(i)
                                  val h = f.optInt("height", 0)
                                  val vc = f.str("vcodec") ?: "none"
                                  if (h >= 144 && vc != "none") hs.add(h)
                              }
                          }
                          return VInfo(
                              url, j.str("title") ?: url, j.str("thumbnail"),
                              j.optLong("duration", 0L), j.str("uploader") ?: "", hs.toList().sortedDescending()
                          )
                      } catch (e: Exception) { last = e }
                  }
                  throw last ?: Exception("Error desconocido")
              }
          }

          class DownloadService : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val jobs = ConcurrentHashMap<String, Job>()

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel("dl", "Descargas", NotificationManager.IMPORTANCE_LOW)
                  )
              }

              private fun notif(text: String) = Notification.Builder(this, "dl")
                  .setContentTitle("Z-Download Pro")
                  .setContentText(text)
                  .setSmallIcon(android.R.drawable.stat_sys_download)
                  .setOngoing(true)
                  .build()

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  startForeground(1, notif("Descargando…"))
                  if (i?.action == "cancel") {
                      i.getStringExtra("id")?.let { id ->
                          Repo.update(id) { it.copy(status = Status.CANCELED, msg = "Cancelado") }
                          runCatching { YoutubeDL.getInstance().destroyProcessById(id) }
                          jobs.remove(id)?.cancel()
                      }
                  } else {
                      val url = i?.getStringExtra("url")
                      val fmt = i?.getStringExtra("fmt") ?: "480"
                      if (url != null) {
                          val id = UUID.randomUUID().toString()
                          Repo.add(DlItem(id, url, i.getStringExtra("title") ?: DEFAULT_TITLE, i.getStringExtra("thumb")))
                          jobs[id] = scope.launch { run(id, url, fmt); jobs.remove(id); finishIfIdle() }
                      }
                  }
                  finishIfIdle()
                  return START_NOT_STICKY
              }

              private fun finishIfIdle() {
                  if (jobs.isEmpty()) { stopForeground(STOP_FOREGROUND_REMOVE); stopSelf() }
              }

              private fun buildRequest(url: String, dir: File, fmt: String, attempt: String?) =
                  YoutubeDLRequest(url).apply {
                      addOption("-o", dir.absolutePath + "/%(title).80s.%(ext)s")
                      addOption("--no-playlist")
                      addOption("--windows-filenames")
                      addOption("--no-mtime")
                      addOption("--retries", "5")
                      addOption("--socket-timeout", "20")
                      if (attempt != null) addOption("--extractor-args", attempt)
                      when (fmt) {
                          "audio" -> { addOption("-f", "ba/b"); addOption("-x"); addOption("--audio-format", "mp3") }
                          "best" -> {
                              addOption("-f", "bv*+ba/b")
                              addOption("-S", "res,vcodec:h264,acodec:aac")
                              addOption("--merge-output-format", "mp4")
                          }
                          else -> {
                              addOption("-f", "bv*[height<=$fmt]+ba/b[height<=$fmt]/b")
                              addOption("-S", "res,vcodec:h264,acodec:aac")
                              addOption("--merge-output-format", "mp4")
                          }
                      }
                  }

              private fun run(id: String, url: String, fmt: String) {
                  val dir = File(cacheDir, "dl/$id").apply { mkdirs() }
                  try {
                      Engine.ensure(this)
                      var last: Exception? = null
                      var done = false
                      for (a in Engine.attempts(url)) {
                          if (Repo.isCanceled(id)) return
                          try {
                              YoutubeDL.getInstance().execute(buildRequest(url, dir, fmt, a), id) { p, eta, line ->
                                  Repo.update(id) { cur ->
                                      var t = cur.title
                                      if (t == DEFAULT_TITLE && line.contains("Destination:")) {
                                          t = line.substringAfter("Destination:").trim()
                                              .substringAfterLast('/').substringBeforeLast('.')
                                      }
                                      cur.copy(
                                          title = t,
                                          progress = (p.coerceAtLeast(0f) / 100f).coerceAtMost(1f),
                                          msg = when {
                                              p >= 99.9f -> "Procesando…"
                                              p <= 0f -> "Preparando…"
                                              eta > 0 -> "Faltan ${eta}s"
                                              else -> ""
                                          }
                                      )
                                  }
                              }
                              done = true
                              break
                          } catch (e: Exception) {
                              if (Repo.isCanceled(id)) return
                              last = e
                              dir.listFiles()?.forEach { it.delete() }
                          }
                      }
                      if (!done) throw last ?: Exception("Error desconocido")
                      val saved = saveToDownloads(dir)
                      Repo.update(id) {
                          it.copy(
                              progress = 1f, status = Status.DONE, msg = "Listo · toca para abrir · Descargas/Z-Download",
                              uri = saved?.first?.toString(), mime = saved?.second
                          )
                      }
                  } catch (e: Exception) {
                      Repo.update(id) {
                          if (it.status == Status.RUNNING) it.copy(status = Status.ERROR, msg = cleanErr(e.message)) else it
                      }
                  } finally {
                      dir.deleteRecursively()
                  }
              }

              private fun saveToDownloads(dir: File): Pair<Uri, String>? {
                  var result: Pair<Uri, String>? = null
                  dir.listFiles()?.filter { it.isFile && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") }
                      ?.sortedBy { it.length() }?.forEach { f ->
                          val mime = when (f.extension.lowercase()) {
                              "mp3" -> "audio/mpeg"; "m4a" -> "audio/mp4"; "mp4" -> "video/mp4"
                              "webm" -> "video/webm"; "mkv" -> "video/x-matroska"; else -> "application/octet-stream"
                          }
                          val cv = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, f.name)
                              put(MediaStore.Downloads.MIME_TYPE, mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Z-Download")
                          }
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return@forEach
                          contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                          result = uri to mime
                      }
                  return result
              }

              override fun onDestroy() { scope.cancel(); super.onDestroy() }
          }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/java/com/zdownload/pro/MainActivity.kt')"
          cat > 'app/src/main/java/com/zdownload/pro/MainActivity.kt' <<'ZEOF'
          package com.zdownload.pro

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.lerp
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          data class Palette(val name: String, val a: Color, val b: Color)

          val palettes = listOf(
              Palette("Aurora", Color(0xFF7F00FF), Color(0xFF00C6FF)),
              Palette("Sunset", Color(0xFFFF512F), Color(0xFFDD2476)),
              Palette("Ocean", Color(0xFF1C92D2), Color(0xFF00E5C3)),
              Palette("Neón", Color(0xFF00F260), Color(0xFF0575E6)),
              Palette("Fuego", Color(0xFFF7971E), Color(0xFFFF1E56)),
              Palette("Royal", Color(0xFF8E2DE2), Color(0xFFF953C6))
          )

          enum class Mode(val label: String) { SYSTEM("Sistema"), LIGHT("Claro"), DARK("Oscuro") }

          val autoQualities = listOf("360", "480", "720", "1080", "best", "audio")

          class MainActivity : ComponentActivity() {
              private val shared = mutableStateOf<String?>(null)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  handle(intent)
                  // Prepara el motor en segundo plano
                  Thread { runCatching { Engine.ensure(applicationContext) } }.start()
                  setContent { ZApp(shared) }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handle(intent)
              }

              private fun handle(i: Intent?) {
                  if (i?.action == Intent.ACTION_SEND) {
                      val text = i.getStringExtra(Intent.EXTRA_TEXT) ?: return
                      Regex("https?://\\S+").find(text)?.value?.let { shared.value = it }
                  }
              }
          }

          fun fmtDuration(s: Long): String {
              if (s <= 0) return ""
              val h = s / 3600; val m = (s % 3600) / 60; val sec = s % 60
              return if (h > 0) "%d:%02d:%02d".format(h, m, sec) else "%d:%02d".format(m, sec)
          }

          fun heightTag(h: Int) = when {
              h >= 2160 -> "4K"; h >= 1440 -> "2K"; h >= 1080 -> "FULL HD"; h >= 720 -> "HD"; else -> ""
          }

          fun openFile(c: Context, d: DlItem) {
              try {
                  c.startActivity(
                      Intent(Intent.ACTION_VIEW).setDataAndType(Uri.parse(d.uri), d.mime)
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  )
              } catch (e: Exception) {
                  Toast.makeText(c, "No se pudo abrir. Búscalo en Descargas/Z-Download", Toast.LENGTH_LONG).show()
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ZApp(shared: MutableState<String?>) {
              val ctx = LocalContext.current
              val prefs = remember { ctx.getSharedPreferences("z", 0) }
              var mode by remember { mutableStateOf(Mode.valueOf(prefs.getString("mode", "SYSTEM")!!)) }
              var palIdx by remember { mutableIntStateOf(prefs.getInt("pal", 0)) }
              var autoQ by remember { mutableStateOf(prefs.getString("q", "480")!!) }
              var auto by remember { mutableStateOf(prefs.getBoolean("auto", false)) }
              var showSettings by remember { mutableStateOf(false) }
              var url by remember { mutableStateOf("") }
              var sheetUrl by remember { mutableStateOf<String?>(null) }
              var info by remember { mutableStateOf<VInfo?>(null) }
              var infoErr by remember { mutableStateOf<String?>(null) }
              var retry by remember { mutableIntStateOf(0) }
              val items by Repo.items.collectAsState()
              val clipboard = LocalClipboardManager.current

              val dark = when (mode) { Mode.SYSTEM -> isSystemInDarkTheme(); Mode.LIGHT -> false; Mode.DARK -> true }
              val p = palettes[palIdx]
              val scheme = if (dark)
                  darkColorScheme(primary = p.a, secondary = p.b, surface = Color(0xFF16161F), onSurface = Color.White)
              else
                  lightColorScheme(primary = p.a, secondary = p.b, surface = Color.White, onSurface = Color(0xFF1A1A1A))

              val notifPerm = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) {}
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= 33) notifPerm.launch(Manifest.permission.POST_NOTIFICATIONS)
              }

              fun onLink(u: String) {
                  if (auto) {
                      startDownload(ctx, u, autoQ)
                      Toast.makeText(ctx, "Descargando en ${qLabel(autoQ)}", Toast.LENGTH_SHORT).show()
                  } else {
                      sheetUrl = u
                  }
              }

              LaunchedEffect(shared.value) {
                  shared.value?.let { onLink(it); shared.value = null }
              }

              // Analiza el enlace cuando se abre la ventana de resoluciones
              LaunchedEffect(sheetUrl, retry) {
                  val u = sheetUrl ?: return@LaunchedEffect
                  info = null; infoErr = null
                  try {
                      info = withContext(Dispatchers.IO) { Engine.fetchInfo(ctx, u) }
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      infoErr = cleanErr(e.message)
                  }
              }

              MaterialTheme(colorScheme = scheme) {
                  val bg = Brush.verticalGradient(
                      if (dark) listOf(lerp(p.a, Color.Black, .82f), lerp(p.b, Color.Black, .88f))
                      else listOf(lerp(p.a, Color.White, .86f), lerp(p.b, Color.White, .86f))
                  )
                  Box(Modifier.fillMaxSize().background(bg)) {
                      Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(16.dp)) {
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              Text(
                                  "Z-Download Pro", Modifier.weight(1f),
                                  style = TextStyle(
                                      brush = Brush.linearGradient(listOf(p.a, p.b)),
                                      fontSize = 28.sp, fontWeight = FontWeight.ExtraBold
                                  )
                              )
                              IconButton(onClick = { showSettings = true }) {
                                  Icon(Icons.Default.Settings, "Ajustes", tint = MaterialTheme.colorScheme.onSurface)
                              }
                          }
                          Spacer(Modifier.height(12.dp))

                          Card(
                              shape = RoundedCornerShape(24.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = .8f))
                          ) {
                              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  OutlinedTextField(
                                      value = url, onValueChange = { url = it },
                                      modifier = Modifier.fillMaxWidth(),
                                      placeholder = { Text("Pega el enlace del video") },
                                      singleLine = true, shape = RoundedCornerShape(16.dp),
                                      trailingIcon = {
                                          TextButton(onClick = { clipboard.getText()?.text?.let { url = it.trim() } }) { Text("Pegar") }
                                      }
                                  )
                                  Text(
                                      if (auto) "⚡ Automático · ${qLabel(autoQ)}  (cambiar)" else "🎞 Elegir resolución al descargar  (cambiar)",
                                      fontSize = 13.sp, color = p.a, fontWeight = FontWeight.SemiBold,
                                      modifier = Modifier.clickable { showSettings = true }
                                  )
                                  GradBtn("Descargar", p) {
                                      val u = Regex("https?://\\S+").find(url)?.value
                                      if (u == null) Toast.makeText(ctx, "Enlace no válido", Toast.LENGTH_SHORT).show()
                                      else { onLink(u); url = "" }
                                  }
                              }
                          }

                          Spacer(Modifier.height(16.dp))
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              Text("Descargas", Modifier.weight(1f), fontWeight = FontWeight.Bold,
                                  fontSize = 18.sp, color = MaterialTheme.colorScheme.onSurface)
                              TextButton(onClick = { Repo.clearFinished() }) { Text("Limpiar") }
                          }

                          if (items.isEmpty()) {
                              Box(Modifier.fillMaxWidth().weight(1f), contentAlignment = Alignment.Center) {
                                  Text("Pega un enlace o usa Compartir desde cualquier app",
                                      color = MaterialTheme.colorScheme.onSurface.copy(alpha = .6f))
                              }
                          } else {
                              LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  items(items, key = { it.id }) { DlCard(it, p) }
                              }
                          }
                      }
                  }

                  // ---- Ventana de resoluciones (estilo Snaptube) ----
                  sheetUrl?.let { u ->
                      ModalBottomSheet(
                          onDismissRequest = { sheetUrl = null },
                          sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
                          containerColor = MaterialTheme.colorScheme.surface
                      ) {
                          Column(
                              Modifier.fillMaxWidth().verticalScroll(rememberScrollState())
                                  .navigationBarsPadding().padding(horizontal = 16.dp, vertical = 8.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              val inf = info
                              if (infoErr != null) {
                                  Text("No se pudo analizar el enlace", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                                  Text(infoErr!!, color = MaterialTheme.colorScheme.onSurface.copy(alpha = .75f))
                                  GradBtn("Reintentar", p) { retry++ }
                                  OutlinedButton(
                                      onClick = { startDownload(ctx, u, "480"); sheetUrl = null },
                                      modifier = Modifier.fillMaxWidth()
                                  ) { Text("Intentar descargar igual (480p)") }
                              } else if (inf == null) {
                                  Row(Modifier.fillMaxWidth().padding(vertical = 32.dp),
                                      horizontalArrangement = Arrangement.Center, verticalAlignment = Alignment.CenterVertically) {
                                      CircularProgressIndicator(color = p.a, modifier = Modifier.size(28.dp))
                                      Spacer(Modifier.width(14.dp))
                                      Text("Analizando enlace…")
                                  }
                              } else {
                                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                      if (inf.thumb != null) {
                                          AsyncImage(
                                              model = inf.thumb, contentDescription = null, contentScale = ContentScale.Crop,
                                              modifier = Modifier.width(128.dp).height(72.dp).clip(RoundedCornerShape(12.dp))
                                          )
                                      }
                                      Column(Modifier.weight(1f)) {
                                          Text(inf.title, maxLines = 2, fontWeight = FontWeight.Bold)
                                          val sub = listOf(inf.uploader, fmtDuration(inf.duration)).filter { it.isNotEmpty() }.joinToString(" · ")
                                          if (sub.isNotEmpty()) Text(sub, fontSize = 12.sp,
                                              color = MaterialTheme.colorScheme.onSurface.copy(alpha = .65f))
                                      }
                                  }
                                  Text("Elige la resolución", fontWeight = FontWeight.SemiBold)
                                  fun pick(fmt: String) { startDownload(ctx, u, fmt, inf.title, inf.thumb); sheetUrl = null
                                      Toast.makeText(ctx, "Descarga iniciada", Toast.LENGTH_SHORT).show() }
                                  OptionRow("⭐", "Mejor calidad disponible", "", p) { pick("best") }
                                  inf.heights.forEach { h -> OptionRow("🎬", "${h}p", heightTag(h), p) { pick(h.toString()) } }
                                  OptionRow("🎵", "Solo audio (MP3)", "", p) { pick("audio") }
                              }
                              Spacer(Modifier.height(12.dp))
                          }
                      }
                  }

                  if (showSettings) {
                      AlertDialog(
                          onDismissRequest = { showSettings = false },
                          confirmButton = { TextButton(onClick = { showSettings = false }) { Text("Listo") } },
                          title = { Text("Ajustes") },
                          text = {
                              Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                                  Text("Descarga", fontWeight = FontWeight.Bold)
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text("Descarga automática")
                                          Text(if (auto) "Descarga directo con la calidad elegida" else "Te muestro las resoluciones",
                                              fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = .65f))
                                      }
                                      Switch(checked = auto, onCheckedChange = { auto = it; prefs.edit().putBoolean("auto", it).apply() })
                                  }
                                  Text("Calidad automática")
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(autoQualities) { q ->
                                          FilterChip(
                                              selected = autoQ == q,
                                              onClick = { autoQ = q; prefs.edit().putString("q", q).apply() },
                                              label = { Text(qLabel(q)) }
                                          )
                                      }
                                  }
                                  Text("Tema", fontWeight = FontWeight.Bold)
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Mode.values().forEach { m ->
                                          FilterChip(
                                              selected = mode == m,
                                              onClick = { mode = m; prefs.edit().putString("mode", m.name).apply() },
                                              label = { Text(m.label) }
                                          )
                                      }
                                  }
                                  Text("Degradado", fontWeight = FontWeight.Bold)
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      items(palettes.size) { i ->
                                          val pl = palettes[i]
                                          Box(
                                              Modifier.size(44.dp).clip(CircleShape)
                                                  .background(Brush.linearGradient(listOf(pl.a, pl.b)))
                                                  .then(if (i == palIdx) Modifier.border(3.dp, MaterialTheme.colorScheme.onSurface, CircleShape) else Modifier)
                                                  .clickable { palIdx = i; prefs.edit().putInt("pal", i).apply() }
                                          )
                                      }
                                  }
                              }
                          }
                      )
                  }
              }
          }

          @Composable
          fun OptionRow(icon: String, title: String, tag: String, p: Palette, onClick: () -> Unit) {
              val shape = RoundedCornerShape(16.dp)
              Row(
                  Modifier.fillMaxWidth().clip(shape)
                      .border(1.dp, Brush.horizontalGradient(listOf(p.a.copy(alpha = .7f), p.b.copy(alpha = .7f))), shape)
                      .clickable(onClick = onClick).padding(horizontal = 16.dp, vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(icon, fontSize = 20.sp)
                  Spacer(Modifier.width(12.dp))
                  Text(title, Modifier.weight(1f), fontWeight = FontWeight.SemiBold)
                  if (tag.isNotEmpty()) {
                      Text(tag, color = p.a, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.width(10.dp))
                  }
                  Text("⬇", fontSize = 18.sp)
              }
          }

          @Composable
          fun GradBtn(text: String, p: Palette, onClick: () -> Unit) {
              Box(
                  Modifier.fillMaxWidth().height(52.dp).clip(RoundedCornerShape(16.dp))
                      .background(Brush.horizontalGradient(listOf(p.a, p.b))).clickable(onClick = onClick),
                  contentAlignment = Alignment.Center
              ) { Text(text, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp) }
          }

          @Composable
          fun DlCard(d: DlItem, p: Palette) {
              val ctx = LocalContext.current
              Card(
                  modifier = Modifier.clickable(enabled = d.status == Status.DONE && d.uri != null) { openFile(ctx, d) },
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface.copy(alpha = .8f)),
                  border = BorderStroke(1.dp, Brush.linearGradient(listOf(p.a.copy(alpha = .6f), p.b.copy(alpha = .6f))))
              ) {
                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.Top) {
                      if (d.thumb != null) {
                          AsyncImage(
                              model = d.thumb, contentDescription = null, contentScale = ContentScale.Crop,
                              modifier = Modifier.width(96.dp).height(60.dp).clip(RoundedCornerShape(10.dp))
                          )
                      }
                      Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(d.title, maxLines = 2, fontWeight = FontWeight.SemiBold, color = MaterialTheme.colorScheme.onSurface)
                          if (d.status == Status.RUNNING) {
                              if (d.progress <= 0f) LinearProgressIndicator(Modifier.fillMaxWidth(), color = p.a)
                              else LinearProgressIndicator(progress = { d.progress }, modifier = Modifier.fillMaxWidth(), color = p.a)
                          }
                          val label = when (d.status) {
                              Status.RUNNING -> if (d.progress > 0f) "${(d.progress * 100).toInt()}% · ${d.msg}" else d.msg
                              Status.DONE -> "✅ ${d.msg}"
                              Status.ERROR -> "⚠️ ${d.msg}"
                              Status.CANCELED -> "Cancelado"
                          }
                          Text(label, fontSize = 13.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = .7f))
                      }
                      IconButton(onClick = {
                          if (d.status == Status.RUNNING) cancelDownload(ctx, d.id) else Repo.remove(d.id)
                      }) { Icon(Icons.Default.Close, "Cerrar", tint = MaterialTheme.colorScheme.onSurface) }
                  }
              }
          }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/java/com/zdownload/pro/Repo.kt')"
          cat > 'app/src/main/java/com/zdownload/pro/Repo.kt' <<'ZEOF'
          package com.zdownload.pro

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.update

          enum class Status { RUNNING, DONE, ERROR, CANCELED }

          const val DEFAULT_TITLE = "Obteniendo información…"

          data class DlItem(
              val id: String,
              val url: String,
              val title: String = DEFAULT_TITLE,
              val thumb: String? = null,
              val progress: Float = 0f,
              val status: Status = Status.RUNNING,
              val msg: String = "",
              val uri: String? = null,
              val mime: String? = null
          )

          data class VInfo(
              val url: String,
              val title: String,
              val thumb: String?,
              val duration: Long,
              val uploader: String,
              val heights: List<Int>
          )

          object Repo {
              val items = MutableStateFlow<List<DlItem>>(emptyList())
              fun add(i: DlItem) = items.update { listOf(i) + it }
              fun update(id: String, f: (DlItem) -> DlItem) =
                  items.update { l -> l.map { if (it.id == id) f(it) else it } }
              fun remove(id: String) = items.update { l -> l.filter { it.id != id } }
              fun clearFinished() = items.update { l -> l.filter { it.status == Status.RUNNING } }
              fun isCanceled(id: String) = items.value.firstOrNull { it.id == id }?.status == Status.CANCELED
          }

          fun startDownload(c: Context, url: String, fmt: String, title: String? = null, thumb: String? = null) {
              ContextCompat.startForegroundService(
                  c, Intent(c, DownloadService::class.java)
                      .putExtra("url", url).putExtra("fmt", fmt)
                      .putExtra("title", title).putExtra("thumb", thumb)
              )
          }

          fun cancelDownload(c: Context, id: String) {
              c.startService(Intent(c, DownloadService::class.java).setAction("cancel").putExtra("id", id))
          }

          fun cleanErr(m: String?): String {
              val lines = (m ?: "").lines().map { it.trim() }.filter { it.isNotEmpty() }
              val line = lines.lastOrNull { it.startsWith("ERROR") } ?: lines.lastOrNull() ?: "Error desconocido"
              val l = line.lowercase()
              return when {
                  "403" in l -> "La plataforma bloqueó la descarga (403). Prueba otra calidad o inténtalo más tarde."
                  "sign in to confirm" in l -> "La plataforma pide verificar que no eres un bot. Inténtalo más tarde."
                  "unable to resolve" in l || "timed out" in l || "network is unreachable" in l -> "Sin conexión a internet."
                  "unsupported url" in l -> "Enlace no compatible."
                  "private" in l -> "El video es privado."
                  else -> line.removePrefix("ERROR:").trim().replace(Regex("https?://\\S+"), "[enlace]").take(160)
              }
          }

          fun qLabel(q: String) = when (q) { "best" -> "Máx"; "audio" -> "MP3"; else -> "${q}p" }
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'ZEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108"
                          android:startColor="#7F00FF" android:endColor="#00C6FF" />
                  </aapt:attr>
              </path>
              <path android:fillColor="#FFFFFF" android:pathData="M48,28h12v26h10L54,72 38,54h10z" />
              <path android:fillColor="#FFFFFF" android:pathData="M36,78h36v6h-36z" />
          </vector>
          ZEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'ZEOF'
          <resources>
              <style name="Theme.Z" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          ZEOF
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'ZEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          ZEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'ZEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          ZEOF
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'ZEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ZDownloadPro"
          include(":app")
          ZEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/*.apk Z-Download-Pro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Z-Download Pro (build ${{ github.run_number }})
          files: Z-Download-Pro.apk
